# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#121826"
    platform.window.MM.UME = true

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "bomb_prize_game"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/bomb_prize_game
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    import zipfile
    archive_bytes = base64.b64decode(BOMB_PRIZE_APK_BASE64)
    with zipfile.ZipFile(io.BytesIO(archive_bytes)) as zip_ref:
        zip_ref.extractall(appdir.as_posix())

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    platform.window.infobox.style.display = "none"
    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">

    const bombPrizeLoader = (() => {
        let watcherStarted = false
        let hidden = false

        function hide() {
            if (hidden) {
                return
            }
            hidden = true
            const loader = document.getElementById("bomb-prize-loader")
            if (loader) {
                loader.classList.add("is-hidden")
            }
        }

        function canvasHasGameFrame(canvas) {
            if (!canvas || canvas.width < 16 || canvas.height < 16) {
                return false
            }
            const ctx = canvas.getContext("2d", { willReadFrequently: true })
            if (!ctx) {
                return false
            }
            const width = canvas.width
            const height = canvas.height
            const stepX = Math.max(12, Math.floor(width / 18))
            const stepY = Math.max(12, Math.floor(height / 14))
            let visiblePixels = 0
            for (let y = Math.floor(stepY / 2); y < height; y += stepY) {
                for (let x = Math.floor(stepX / 2); x < width; x += stepX) {
                    const pixel = ctx.getImageData(x, y, 1, 1).data
                    const nearBlankBackground =
                        Math.abs(pixel[0] - 18) < 10 &&
                        Math.abs(pixel[1] - 24) < 10 &&
                        Math.abs(pixel[2] - 38) < 10
                    if (pixel[3] > 0 && !nearBlankBackground) {
                        visiblePixels += 1
                    }
                    if (visiblePixels >= 4) {
                        return true
                    }
                }
            }
            return false
        }

        function startWatching() {
            if (watcherStarted || hidden) {
                return
            }
            watcherStarted = true
            const startedAt = Date.now()
            const check = () => {
                const canvas = document.getElementById("canvas")
                try {
                    if (canvasHasGameFrame(canvas)) {
                        hide()
                        return
                    }
                } catch (error) {
                    console.warn("Bomb Prize loader canvas check skipped", error)
                }
                if (!hidden && Date.now() - startedAt < 60000) {
                    requestAnimationFrame(check)
                }
            }
            requestAnimationFrame(check)
        }

        return { hide, startWatching }
    })()

    window.bombPrizeLoader = bombPrizeLoader
    if (window.__bombPrizeLoaderStartRequested) {
        setTimeout(bombPrizeLoader.startWatching, 250)
    }

    globalThis.__canvas_resized = (self, ecw, ech) => {
        console.warn("TODO: panda3d canvas monitor", self, ecw, ech)
    }

    function force_visible_canvas() {
        const canvas = document.getElementById("canvas")
        if (!canvas) {
            return
        }
        if (!canvas.dataset.bombPrizeSized) {
            canvas.width = 900
            canvas.height = 700
            canvas.dataset.bombPrizeSized = "1"
        }
        canvas.hidden = false
        canvas.style.position = "fixed"
        canvas.style.inset = "auto"
        canvas.style.top = "env(safe-area-inset-top, 0px)"
        canvas.style.right = "env(safe-area-inset-right, 0px)"
        canvas.style.bottom = "env(safe-area-inset-bottom, 0px)"
        canvas.style.left = "env(safe-area-inset-left, 0px)"
        canvas.style.width = "calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))"
        canvas.style.height = "calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))"
        canvas.style.display = "block"
        canvas.style.visibility = "visible"
        canvas.style.opacity = "1"
        canvas.style.zIndex = "2147483000"
        canvas.style.backgroundColor = "#121826"
    }

    async function custom_onload(debug_hidden) {
        // this is called before anything python is loaded
        // make your js customization here
        console.log(__FILE__, "custom_onload")
        force_visible_canvas()
        setInterval(force_visible_canvas, 500)

        pyconsole.hidden = debug_hidden
        system.hidden = debug_hidden
